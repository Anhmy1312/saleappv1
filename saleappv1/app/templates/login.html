<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 400px;">
        <h2>ĐĂNG NHẬP</h2>
        
        {% if err %}
            <p style="color: red; font-weight: bold;">{{ err }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="post" class="search-form" style="flex-direction: column;">
            <div style="margin-bottom: 12px;">
                <label>Tên đăng nhập:</label><br>
                <input type="text" name="username" required style="width: 100%; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Mật khẩu:</label><br>
                <input type="password" name="password" required style="width: 100%; margin-top: 5px;">
            </div>
            <button type="submit" style="width: 100%;">Đăng nhập</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký ngay</a> | <a href="{{ url_for('index') }}">Về trang chủ</a>
        </p>
    </div>
</body>
</html>
