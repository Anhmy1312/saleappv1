<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sản Phẩm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2>QUẢN LÝ SẢN PHẨM</h2>
        
        <!-- Form tìm kiếm sản phẩm theo tên & khoảng giá -->
        <form action="{{ url_for('products') }}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="Tìm theo tên..." value="{{ request.args.get('keyword', '') }}">
            <input type="number" name="from_price" placeholder="Giá từ..." value="{{ request.args.get('from_price', '') }}">
            <input type="number" name="to_price" placeholder="Giá đến..." value="{{ request.args.get('to_price', '') }}">
            <button type="submit">Tìm</button>
        </form>

        <table border="1" cellpadding="10" cellspacing="0">
            <tr>
                <th>Hình ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Mô tả</th>
                <th>Giá bán</th>
            </tr>
            {% for p in products %}
            <tr>
                <td><img src="{{ p.image }}" alt="{{ p.name }}" width="100"></td>
                <td>
                    <!-- Click vào tên chuyển sang trang chi tiết (Yêu cầu 4) -->
                    <a href="{{ url_for('product_detail', product_id=p.id) }}"><strong>{{ p.name }}</strong></a>
                </td>
                <td>{{ p.description }}</td>
                <td>{{ "{:,.0f}".format(p.price) }} VNĐ</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">Không tìm thấy sản phẩm nào!</td>
            </tr>
            {% endfor %}
        </table>
        <p><a href="{{ url_for('index') }}">⬅ Quay lại trang chủ</a></p>
    </div>
</body>
</html>
